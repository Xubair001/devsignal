name: ci

on:
  # Every branch, not just main and dev. Feature branches come off dev and are
  # where the work actually happens, so limiting CI to the two long-lived
  # branches meant a branch was unverified until the moment it merged — which is
  # the least useful moment to find out.
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a push that lands while the previous
# run is still going makes that run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # pgvector, not postgres: v1 keeps rows, FTS and kNN in one database, and
      # the plain postgres images do not bundle the extension.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devsignal
          POSTGRES_PASSWORD: devsignal
          POSTGRES_DB: devsignal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devsignal -d devsignal"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://devsignal:devsignal@localhost:5432/devsignal?sslmode=disable
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: devsignal
      S3_SECRET_KEY: devsignal123
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod rather than restating it here: a
          # duplicated version silently drifts from the one the code declares.
          go-version-file: go.mod
          cache: true

      # Object storage cannot be a `services:` entry: the minio image's default
      # command is just `minio` with no subcommand, and service containers have
      # no way to supply `server /data`. Started here instead — early, so it
      # warms up while formatting, vet, lint and build run.
      #
      # It is not optional: resumes and their extracted text live here, and the
      # erasure guarantee is only meaningful if the store it deletes from exists.
      - name: start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=devsignal -e MINIO_ROOT_PASSWORD=devsignal123 \
            minio/minio:latest server /data
          # The HTTP health endpoint, not `mc ready`: mc needs an alias
          # configured first, which is why the service health-check never passed.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "object storage ready"; exit 0
            fi
            sleep 2
          done
          echo "object storage did not become ready"; docker logs minio; exit 1

      - name: verify formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

      # Both tag sets: the integration files only compile under the build tag, so
      # a plain vet would never look at them.
      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: lint
        # v9 is required for a golangci-lint v2 config. v6 is built for v1 and
        # rejects `version: "2"` outright, exiting 3 before it lints anything.
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: an unpinned linter changes CI results with no
          # code change. Keep this in step with the Makefile and docs.
          version: v2.12.2

      - name: build
        run: go build ./...

      # -race on the unit suite. It is roughly 10x slower, so the broader suites
      # stay off the per-push path once they grow.
      - name: unit tests
        run: go test -race -count=1 ./...

      - name: install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      # Migrations must survive both directions — a rolling deploy runs old and
      # new code against one schema, so a forward-only migration breaks the
      # deploy it ships in.
      - name: migrations up, down, up
        run: |
          migrate -path migrations -database "$DATABASE_URL" up
          migrate -path migrations -database "$DATABASE_URL" down -all
          migrate -path migrations -database "$DATABASE_URL" up

      # The guarantees that matter live here: SKIP LOCKED isolation, refresh-token
      # replay revocation, absence-based closure, dedup precision. Running
      # migrations without ever querying through them proves very little.
      #
      # Through `make`, not a bare `go test`, so CI and a developer's machine run
      # the identical path: the target provisions a disposable database, and the
      # suite refuses to run anywhere else. CI happens to start clean, which is
      # exactly why it could never have caught the tests mutating real data.
      - name: integration tests
        run: make test-integration DB_URL="$DATABASE_URL"

      # The gate hard rule 16 refers to. It runs the real retrieval, gate and
      # scorer against a frozen corpus and label set, so a scoring change that
      # quietly makes ranking worse fails here rather than in production. Verified
      # to fail: breaking the domain factor drops NDCG@10 by 0.305.
      - name: eval gate
        run: make eval DB_URL="$DATABASE_URL"

      - name: schema sanity
        run: |
          psql "$DATABASE_URL" -c "\dt"
          psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"
